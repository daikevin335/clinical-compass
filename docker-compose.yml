# Docker Compose for Clinical Compass
#
# This file defines the services needed to run the project locally:
# - db: PostgreSQL database
# - app: Python ETL container that extracts, cleans, and loads data
# - airflow: orchestrates the ETL tasks on a schedule
#
# The app waits for Postgres to start, then runs:
#   python3 src/extract.py
#   python3 src/clean.py
#   python3 src/load.py
#
# The DB data is stored in a Docker volume so it persists across restarts.

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nurse_job_postings
      POSTGRES_USER: kevindai
      POSTGRES_PASSWORD: examplepassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    volumes:
      - .:/app
    environment:
      CC_DB_NAME: nurse_job_postings
      CC_DB_USER: kevindai
      CC_DB_PASSWORD: examplepassword
      CC_DB_HOST: db
      CC_DB_PORT: "5432"
    command: bash -c "python3 src/wait_for_db.py && python3 src/extract.py && python3 src/clean.py && python3 src/load.py"

  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      CC_DB_NAME: nurse_job_postings
      CC_DB_USER: kevindai
      CC_DB_PASSWORD: examplepassword
      CC_DB_HOST: db
      CC_DB_PORT: "5432"
    volumes:
      - .:/opt/clinical-compass
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "pip install --no-cache-dir -r /opt/clinical-compass/requirements.txt && airflow standalone"

volumes:
  postgres_data:
    driver: local
